[package]
name = "ferris-profile-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ferris-profile-inspector-cli"
path = "src/main.rs"

[dependencies]
ferris-core = { path = "../../crates/ferris-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
